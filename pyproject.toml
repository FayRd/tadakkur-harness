[project]
name = "tadakkur-harness"
version = "0.1.0"
description = "Enhanced LLM Harness for Memory Capacity and Utilisation"
readme = "README.md"
authors = [
    { name = "FayRd", email = "fayyadhrasid06@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "langchain>=1.5.0",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.21",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tadakkur-harness = "tadakkur_harness:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
